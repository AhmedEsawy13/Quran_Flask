<!doctype html><html><head><meta charset="utf-8"><title>ASR self-test</title>
<style>body{font:28px monospace;padding:20px;background:#fff} #s{white-space:pre-wrap}</style></head>
<body><div id="s">starting…</div>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<script>
const S = document.getElementById('s');
const log = m => { S.textContent += '\n' + m; };
(async () => {
  try {
    if (!window.ort) throw new Error('ort global missing after CDN load');
    log('ort loaded: ' + (ort.env && ort.env.versions ? JSON.stringify(ort.env.versions) : 'ok'));
    ort.env.wasm.numThreads = 1;
    ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/';
    log('creating session from /static/asr_model.q8.onnx …');
    const t0 = performance.now();
    const sess = await ort.InferenceSession.create('/static/asr_model.q8.onnx', { executionProviders: ['wasm'] });
    log('SESSION OK in ' + Math.round(performance.now() - t0) + 'ms');
    log('inputs: ' + sess.inputNames.join(','));
    const T = 50;
    const feeds = {
      audio_signal: new ort.Tensor('float32', new Float32Array(80 * T), [1, 80, T]),
      length: new ort.Tensor('int64', new BigInt64Array([BigInt(T)]), [1]),
      cache_last_channel: new ort.Tensor('float32', new Float32Array(1*17*70*512), [1,17,70,512]),
      cache_last_time: new ort.Tensor('float32', new Float32Array(1*17*512*8), [1,17,512,8]),
      cache_last_channel_len: new ort.Tensor('int64', new BigInt64Array([0n]), [1]),
    };
    const out = await sess.run(feeds);
    log('FORWARD OK → logprobs ' + out.logprobs.dims.join('x'));
    S.style.background = '#d7ffd7';
    log('✅ ALL GOOD — ort-web can run the model in this browser.');
  } catch (e) {
    S.style.background = '#ffd7d7';
    log('❌ ERROR: ' + (e && (e.message || e.name) || e));
    console.error(e);
  }
})();
</script></body></html>
