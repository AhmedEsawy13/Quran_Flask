<!DOCTYPE html>
{% from "_athar_shell.html" import athar_shell_head, athar_app_bar with context %}
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>أثَر · محرّر المصحف — مواضع الوقف</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <link rel="preload" href="{{ url_for('static', filename='fonts/oldmadina.woff2') }}" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="{{ url_for('static', filename='fonts/uthmanic_hafs_v20.woff2') }}" as="font" type="font/woff2" crossorigin="anonymous">

    <!-- أثَر shared brand identity (fonts + logo) -->
    {{ athar_shell_head() }}
    <link rel="stylesheet" href="{{ static_hash('css/athar-page-chrome.css') }}">
    <link rel="stylesheet" href="{{ static_hash('css/mushaf_editor.css') }}">
    <script src="{{ static_hash('js/athar-api.js') }}"></script>
    <script src="{{ static_hash('js/athar-mushaf.js') }}"></script>
    <script src="{{ static_hash('js/athar-page-chrome.js') }}"></script>

    <link rel="preload" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"></noscript>

    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
</head>
<body class="athar-editor">
    {{ athar_app_bar() }}

    <section class="ed-bar" id="ed-bar" aria-labelledby="ed-title">
        <div class="ed-bar-intro">
            <p class="athar-kicker">— محرّر المصحف</p>
            <h1 class="ed-title athar-display" id="ed-title" aria-label="راجع المصحف، واضبط الوقف.">راجِع المصحــف، واضبط الوقف.</h1>
            <p class="ed-subtitle">قارن النسخة المطبوعة بأصل المدينة، ثم ثبّت مواضع الاختلاف.</p>
        </div>

        <div class="ed-bar-tools" aria-label="أدوات المحرّر">
            <div class="ed-edition-toggle athar-tabs" id="ed-edition-toggle" role="group" aria-label="نسخة المصحف">
                <button class="ed-edition-btn athar-tab" data-edition="قطر" type="button" aria-pressed="false">مصحف قطر</button>
                <button class="ed-edition-btn athar-tab" data-edition="الكويت" type="button" aria-pressed="false">الكويت الحديث</button>
            </div>

            <div class="ed-review-group">
                <div class="ed-progress" id="ed-progress" role="progressbar" aria-label="الصفحات المراجَعة" aria-valuemin="0" aria-valuemax="604" aria-valuenow="0"></div>

                <label class="ed-reviewed-toggle" title="وضع علامة على هاتين الصفحتين كمُراجَعتين">
                    <input type="checkbox" id="ed-reviewed">
                    <span>تمت المراجعة</span>
                </label>
            </div>

            <div class="ed-location-tools">
                <div class="ed-jump">
                    <input class="athar-field" type="number" id="ed-jump-page" min="1" max="604" placeholder="رقم الصفحة" aria-label="الانتقال إلى صفحة">
                    <button class="ed-icon-btn athar-icon-button" id="ed-jump-go" type="button" title="انتقال" aria-label="انتقال"><i class="fas fa-arrow-left" aria-hidden="true"></i></button>
                </div>

                <div class="ed-nav">
                    <button class="ed-icon-btn athar-icon-button" id="ed-prev" type="button" title="السابق" aria-label="الصفحتان السابقتان"><i class="fas fa-chevron-right" aria-hidden="true"></i></button>
                    <span class="ed-spread-label" id="ed-spread-label" aria-live="polite"></span>
                    <button class="ed-icon-btn athar-icon-button" id="ed-next" type="button" title="التالي" aria-label="الصفحتان التاليتان"><i class="fas fa-chevron-left" aria-hidden="true"></i></button>
                </div>
            </div>
        </div>
    </section>

    <div class="ed-toast" id="ed-status" role="status" aria-live="polite" hidden></div>
    <aside class="ed-legend" id="ed-legend" aria-label="دليل علامات الوقف"></aside>

    <main class="ed-main" id="athar-main" tabindex="-1" aria-labelledby="ed-title">
        <div class="ed-spread" id="ed-spread">
            <div class="ed-page-card athar-page-card" data-side="right">
                <div class="ed-page-header athar-page-head">
                    <span class="ed-head-info">
                        <span class="ed-head-juz athar-page-head-juz" id="ed-juz-r"></span>
                        <span class="ed-head-surah athar-page-head-surah" id="ed-surah-r"></span>
                    </span>
                    <span class="ed-head-info">
                        <span class="ed-page-num" id="ed-page-r-num"></span>
                        <button class="ed-ref-btn athar-icon-button" id="ed-ref-r" type="button" aria-label="فتح مرجع الصفحة" hidden><i class="fas fa-book-open" aria-hidden="true"></i></button>
                    </span>
                </div>
                <div class="ed-page" id="ed-page-r" dir="rtl"></div>
            </div>
            <div class="ed-page-card athar-page-card" data-side="left">
                <div class="ed-page-header athar-page-head">
                    <span class="ed-head-info">
                        <span class="ed-head-juz athar-page-head-juz" id="ed-juz-l"></span>
                        <span class="ed-head-surah athar-page-head-surah" id="ed-surah-l"></span>
                    </span>
                    <span class="ed-head-info">
                        <span class="ed-page-num" id="ed-page-l-num"></span>
                        <button class="ed-ref-btn athar-icon-button" id="ed-ref-l" type="button" aria-label="فتح مرجع الصفحة" hidden><i class="fas fa-book-open" aria-hidden="true"></i></button>
                    </span>
                </div>
                <div class="ed-page" id="ed-page-l" dir="rtl"></div>
            </div>
        </div>
    </main>

    <!-- word edit popup (bottom sheet) -->
    <div class="ed-popup-backdrop" id="ed-popup-backdrop" hidden></div>
    <div class="ed-popup athar-surface" id="ed-popup" hidden role="dialog" aria-modal="true" aria-labelledby="ed-popup-title" aria-describedby="ed-popup-baseline" tabindex="-1">
        <div class="ed-popup-head">
            <span class="ed-popup-title" id="ed-popup-title"></span>
            <button class="ed-popup-close athar-icon-button" id="ed-popup-close" type="button" aria-label="إغلاق"><i class="fas fa-xmark" aria-hidden="true"></i></button>
        </div>
        <div class="ed-popup-baseline" id="ed-popup-baseline"></div>
        <div class="ed-popup-syms" id="ed-popup-syms"></div>
        <button class="ed-popup-clear" id="ed-popup-clear" type="button"><i class="fas fa-eraser" aria-hidden="true"></i> بلا علامة</button>
    </div>

    <script src="{{ static_hash('js/mushaf_editor.js') }}"></script>
</body>
</html>
