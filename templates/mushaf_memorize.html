<!DOCTYPE html>
{% from "_athar_shell.html" import athar_shell_head, athar_app_bar with context %}
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="الحفظ بالتصوير الذهني — احفظ الآيات من مكانها الحقيقي على صفحة مصحف المدينة بالتكرار التراكمي المقطعي مع تلاوة متزامنة">
    <title>أثَر · تثبيت — الحفظ بالتصوير الذهني</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <!-- Mushaf fonts, preloaded -->
    <link rel="preload" href="{{ url_for('static', filename='fonts/digitalkhatt.woff2') }}" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="{{ url_for('static', filename='fonts/oldmadina.woff2') }}" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="{{ url_for('static', filename='fonts/surah_names.woff2') }}" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="{{ url_for('static', filename='fonts/QCF BSML @Am9li9.ttf') }}" as="font" type="font/ttf" crossorigin="anonymous">
    <link rel="preload" href="{{ url_for('static', filename='fonts/quran-common.woff2') }}" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="{{ url_for('static', filename='fonts/uthmanic_hafs_v20.woff2') }}" as="font" type="font/woff2" crossorigin="anonymous">

    <link rel="stylesheet" href="{{ static_hash('css/athar-page-chrome.css') }}">
    <link rel="stylesheet" href="{{ static_hash('css/mushaf_memorize.css') }}">
    <!-- أثَر shared brand identity (fonts + logo) -->
    {{ athar_shell_head() }}
    <script src="{{ static_hash('js/athar-api.js') }}"></script>
    <script src="{{ static_hash('js/athar-mushaf.js') }}"></script>
    <script src="{{ static_hash('js/athar-ui.js') }}"></script>
    <script src="{{ static_hash('js/athar-page-chrome.js') }}"></script>

    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"></noscript>

    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
</head>
<body>
    {{ athar_app_bar() }}

    <!-- ── Top control bar (transport + display + reciter/repeat) ──── -->
    <header class="mz-bar" id="mz-bar">

        <!-- reciter + repeat (popover) -->
        <div class="mz-pop">
            <button class="mz-bar-chip" id="mz-reciter-trigger" type="button" aria-expanded="false" aria-haspopup="true" title="القارئ والتكرار">
                <i class="fas fa-microphone-lines"></i>
                <span class="mz-chip-label" id="mz-reciter-label">القارئ</span>
                <span class="mz-reps-badge" id="mz-reps-badge">×٣</span>
                <i class="fas fa-chevron-down mz-caret"></i>
            </button>
            <div class="mz-pop-panel" id="mz-reciter-panel" hidden>
                <div class="mz-field">
                    <label for="mz-reciter">القارئ</label>
                    <div class="mz-select-wrap"><select id="mz-reciter"></select><i class="fas fa-chevron-down"></i></div>
                </div>
                <div class="mz-grid2">
                    <div class="mz-field">
                        <label for="mz-verse-reps">تكرار الآية</label>
                        <div class="mz-select-wrap"><select id="mz-verse-reps">
                            <option value="1">١</option><option value="2">٢</option><option value="3" selected>٣</option>
                            <option value="5">٥</option><option value="7">٧</option><option value="10">١٠</option>
                        </select><i class="fas fa-chevron-down"></i></div>
                    </div>
                    <div class="mz-field">
                        <label for="mz-link-reps">تكرار الربط</label>
                        <div class="mz-select-wrap"><select id="mz-link-reps"><option value="1" selected>١</option><option value="2">٢</option><option value="3">٣</option></select><i class="fas fa-chevron-down"></i></div>
                    </div>
                </div>
                <label class="mz-chip-toggle"><input type="checkbox" id="mz-cumulative" checked><span class="mz-chip-dot"></span> ربط الآيات تراكميًا</label>
                <label class="mz-chip-toggle"><input type="checkbox" id="mz-split-long" checked><span class="mz-chip-dot"></span> تقسيم حسب الوقف</label>
                <label class="mz-chip-toggle"><input type="checkbox" id="mz-loop"><span class="mz-chip-dot"></span> تكرار النطاق كاملًا</label>
                <div class="mz-est" id="mz-est" title="مجموع زمن التشغيل المتوقع لكل تكرارات الجلسة"></div>
            </div>
        </div>

        <!-- mushaf source (popover) -->
        <div class="mz-pop">
            <button class="mz-bar-chip" id="mz-src-trigger" type="button" aria-expanded="false" aria-haspopup="true" title="رسم المصحف">
                <i class="fas fa-book-quran"></i>
                <span class="mz-chip-label" id="mz-src-label">المدينة الجديد</span>
                <i class="fas fa-chevron-down mz-caret"></i>
            </button>
            <div class="mz-pop-panel" id="mz-src-panel" hidden>
                <div class="mz-field">
                    <label for="mz-src">رسم المصحف</label>
                    <div class="mz-select-wrap"><select id="mz-src">
                        <option value="digital_khatt">المدينة الجديد</option>
                        <option value="qpc_v1">المدينة ١٤٠٥</option>
                        <option value="shamarly">الشمرلي (صفحات مختارة)</option>
                    </select><i class="fas fa-chevron-down"></i></div>
                </div>
                <label class="mz-chip-toggle"><input type="checkbox" id="mz-tb-waqf"><span class="mz-chip-dot"></span> إظهار علامات الوقف (المدينة)</label>
            </div>
        </div>

        <span class="mz-bar-sep"></span>
        <!-- display toggles -->
        <button class="mz-bar-btn" id="mz-tb-tajweed" type="button" aria-pressed="false" title="تلوين التجويد" aria-label="تلوين التجويد"><i class="fas fa-palette"></i></button>
        <button class="mz-bar-btn" id="mz-tb-hide" type="button" aria-pressed="false" title="إخفاء النص للتسميع" aria-label="إخفاء النص"><i class="fas fa-eye-slash"></i></button>
        <button class="mz-bar-btn" id="mz-tb-layout" type="button" title="صفحة واحدة / صفحتان" aria-label="عدد الصفحات"><i class="fas fa-book-open"></i></button>
        <div class="mz-bar-asr" id="mz-asr-dev" hidden>
            <button class="mz-bar-btn" id="mz-recite-btn" type="button" title="التسميع والمتابعة (تجريبي)" aria-label="بدء التسميع والمتابعة" aria-pressed="false"><i class="fas fa-microphone"></i></button>
            <span class="mz-asr-note" id="mz-asr-note" aria-live="polite"></span>
        </div>

        <div class="mz-bar-spacer"></div>

        <!-- now-playing + transport -->
        <span class="mz-now" id="mz-now"></span>
        <span class="mz-remaining" id="mz-remaining"></span>
        <div class="mz-transport">
            <button class="mz-ctl mz-only-wide" id="mz-prev-step" type="button" title="المقطع السابق" aria-label="المقطع السابق"><i class="fas fa-backward-step"></i></button>
            <button class="mz-play-btn" id="mz-play" type="button" title="تشغيل" aria-label="تشغيل"><i class="fas fa-play"></i></button>
            <button class="mz-ctl mz-only-wide" id="mz-next-step" type="button" title="المقطع التالي" aria-label="المقطع التالي"><i class="fas fa-forward-step"></i></button>
            <button class="mz-ctl mz-ctl-stop" id="mz-stop" type="button" title="إنهاء الجلسة" aria-label="إيقاف"><i class="fas fa-xmark"></i></button>
            <div class="mz-vol" title="مستوى الصوت">
                <button class="mz-bar-btn" id="mz-vol-btn" type="button" aria-label="كتم الصوت"><i class="fas fa-volume-high" id="mz-vol-icon"></i></button>
                <input type="range" id="mz-volume" class="mz-vol-range" min="0" max="100" value="100" dir="ltr" aria-label="مستوى الصوت">
            </div>
        </div>

        <!-- slim progress along the bar's bottom edge -->
        <div class="mz-bar-progress" id="mz-progress" role="slider" aria-label="موضع المقطع" tabindex="0"><div class="mz-bar-progress-fill" id="mz-progress-fill"></div></div>

        <!-- compat: elements still driven by JS but no longer shown directly -->
        <div class="mz-compat" hidden aria-hidden="true">
            <select id="mz-surah"></select>
            <select id="mz-from"></select>
            <select id="mz-to"></select>
            <select id="mz-layout"><option value="dual">صفحتان</option><option value="single">صفحة واحدة</option></select>
            <button id="mz-tajweed" type="button" aria-pressed="false"></button>
            <button id="mz-start" type="button"></button>
            <span id="mz-time-cur"></span><span id="mz-time-dur"></span>
            <span id="mz-hint"></span>
            <input id="mz-justify" type="range" min="0" max="100" value="50"><span id="mz-justify-val"></span>
            <select id="mz-split-mode"><option value="acoustic" selected></option></select>
            <input id="mz-gap" type="range" min="120" max="500" value="250"><span id="mz-gap-val"></span>
            <div id="mz-waqf-pills"></div>
            <div id="mz-player"></div><span id="mz-player-reciter"></span>
        </div>
    </header>

    <!-- transient status toast -->
    <div class="mz-toast" id="mz-status" role="status" aria-live="polite" hidden></div>

    <main class="mz-main" id="athar-main" tabindex="-1">
        <!-- ── Mushaf stage (center) ──────────────────────────────── -->
        <section class="mz-content">
          <button class="mz-nav-btn mz-nav-prev" id="mz-prev" type="button" title="السابق (→)" aria-label="السابق"><i class="fas fa-chevron-right"></i></button>
          <button class="mz-nav-btn mz-nav-next" id="mz-next" type="button" title="التالي (←)" aria-label="التالي"><i class="fas fa-chevron-left"></i></button>
          <div class="mz-stage-area">
            <div class="mz-stage" id="mz-stage" aria-label="صفحة المصحف">
                <div class="mz-spread" id="mz-spread">
                    <div class="mz-page-card athar-page-card" data-side="right">
                        <div class="mz-page-header athar-page-head"><span class="mz-head-juz athar-page-head-juz" id="mz-juz-r"></span><span class="mz-head-surah athar-page-head-surah" id="mz-surah-r"></span></div>
                        <div class="mz-page" id="mz-page-r" dir="rtl"></div>
                        <div class="mz-page-footer"><span class="mz-foot-page" id="mz-foot-r"></span></div>
                    </div>
                    <div class="mz-page-card athar-page-card" data-side="left">
                        <div class="mz-page-header athar-page-head"><span class="mz-head-juz athar-page-head-juz" id="mz-juz-l"></span><span class="mz-head-surah athar-page-head-surah" id="mz-surah-l"></span></div>
                        <div class="mz-page" id="mz-page-l" dir="rtl"></div>
                        <div class="mz-page-footer"><span class="mz-foot-page" id="mz-foot-l"></span></div>
                    </div>
                </div>
            </div>
            <!-- live recitation transcript (recite & follow) -->
            <div class="mz-asr-live" id="mz-asr-live" hidden><i class="fas fa-microphone"></i><span id="mz-asr-live-text"></span></div>
          </div><!-- /.mz-stage-area -->
        </section>
    </main>

    <!-- ── Tap-to-pick: juz / surah / page navigation sheet ─────────── -->
    <div class="mz-picker" id="mz-picker" hidden>
        <div class="mz-picker-backdrop" id="mz-picker-backdrop"></div>
        <div class="mz-picker-sheet" role="dialog" aria-modal="true" aria-labelledby="mz-picker-title">
            <div class="mz-picker-head">
                <span class="mz-picker-title" id="mz-picker-title"></span>
                <button class="mz-picker-close" id="mz-picker-close" type="button" aria-label="إغلاق"><i class="fas fa-xmark"></i></button>
            </div>
            <input type="search" class="mz-picker-search" id="mz-picker-search" placeholder="بحث…" hidden>
            <div class="mz-picker-list" id="mz-picker-list"></div>
        </div>
    </div>

    <audio id="mz-audio" preload="auto"></audio>

    <script src="{{ static_hash('js/mushaf_memorize.js') }}"></script>
</body>
</html>
