<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تدريب الوقف — تدرّب على مواضع الوقف والابتداء: علّم أين وقفت، وقيّم وقوفك على علامات المصاحف وأحكام الأئمة (الداني والأشموني)">
    <title>أثَر · تدريب الوقف</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="{{ url_for('static', filename='fonts/uthmanic_hafs_v20.woff2') }}" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="{{ url_for('static', filename='fonts/oldmadina.woff2') }}" as="font" type="font/woff2" crossorigin="anonymous">

    <link rel="stylesheet" href="{{ static_hash('css/mushaf_memorize.css') }}">
    <link rel="stylesheet" href="{{ static_hash('css/waqf_practice.css') }}">
    <link rel="stylesheet" href="{{ static_hash('css/brand.css') }}">
    <script src="{{ static_hash('js/theme.js') }}"></script>

    <link rel="preload" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"></noscript>
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
</head>
<body>
    <header class="athar-bar">
        <a class="athar-brand" href="/" title="أثَر — مع القرآن">
            <span class="athar-logo">أثَر</span>
            <span class="athar-tag">مع القرآن</span>
        </a>
        <nav class="athar-nav">
            <a href="/">المصحف</a>
            <a href="/memorize">تثبيت</a>
            <a href="/waqf">مُكْث</a>
            <a href="/waqf-practice" class="is-active">تدريب</a>
        </nav>
    </header>

    <header class="mz-bar" id="wp-bar">
        <!-- المقطع: surah / from / to (popover) -->
        <div class="mz-pop">
            <button class="mz-bar-chip" id="wp-range-trigger" type="button" aria-expanded="false" aria-haspopup="true" title="المقطع">
                <i class="fas fa-list-ol"></i>
                <span class="mz-chip-label" id="wp-range-label">اختر مقطعًا</span>
                <i class="fas fa-chevron-down mz-caret"></i>
            </button>
            <div class="mz-pop-panel" id="wp-range-panel" hidden>
                <div class="mz-field">
                    <label for="wp-surah">السورة</label>
                    <div class="mz-select-wrap"><select id="wp-surah"></select><i class="fas fa-chevron-down"></i></div>
                </div>
                <div class="mz-grid2">
                    <div class="mz-field">
                        <label for="wp-from">من الآية</label>
                        <div class="mz-select-wrap"><select id="wp-from"></select><i class="fas fa-chevron-down"></i></div>
                    </div>
                    <div class="mz-field">
                        <label for="wp-to">إلى الآية</label>
                        <div class="mz-select-wrap"><select id="wp-to"></select><i class="fas fa-chevron-down"></i></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- المصحف: mushaf version (popover) -->
        <div class="mz-pop">
            <button class="mz-bar-chip" id="wp-mushaf-trigger" type="button" aria-expanded="false" aria-haspopup="true" title="المصحف">
                <i class="fas fa-book-quran"></i>
                <span class="mz-chip-label" id="wp-mushaf-label">المصحف</span>
                <i class="fas fa-chevron-down mz-caret"></i>
            </button>
            <div class="mz-pop-panel" id="wp-mushaf-panel" hidden>
                <div class="mz-field">
                    <label for="wp-mushaf">رسم المصحف للتقييم</label>
                    <div class="mz-select-wrap"><select id="wp-mushaf"></select><i class="fas fa-chevron-down"></i></div>
                </div>
            </div>
        </div>

        <span class="mz-bar-sep"></span>
        <button class="mz-bar-btn" id="wp-follow" type="button" aria-pressed="true" title="تتبّع الكلمة أثناء التلاوة" aria-label="تتبّع الكلمة"><i class="fas fa-highlighter"></i></button>
        <button class="mz-bar-btn" id="wp-tajweed" type="button" aria-pressed="true" title="كشف أخطاء التجويد والنطق" aria-label="كشف أخطاء التجويد"><i class="fas fa-magnifying-glass"></i></button>
        <button class="mz-bar-btn" id="wp-layout" type="button" aria-pressed="false" hidden title="منظر المصحف" aria-label="منظر المصحف"><i class="fas fa-book-open"></i></button>

        <div class="mz-bar-spacer"></div>

        <button class="mz-btn-primary" id="wp-load" type="button"><i class="fas fa-play"></i> ابدأ التدريب</button>
        <button class="mz-bar-btn" data-athar-theme="cycle" type="button" title="تبديل الوضع" aria-label="تبديل الوضع"><i class="fas fa-moon"></i></button>
    </header>

    <main class="wp-main">
        <p class="mz-hint" id="wp-hint" hidden>
            <i class="fas fa-hand-pointer"></i>
            اضغط على كل كلمةٍ <b>وقفتَ عندها</b> (تُعلَّم بخطٍّ تحتها) — أو اضغط
            <b>سجّل وقوفي</b> وتلاوةً، فتُعلَّم مواضع وقوفك تلقائيًّا. ثم قيّم وقوفك.
        </p>

        <section class="mz-sec" id="wp-passage-sec" hidden>
            <h2 class="mz-sec-title"><i class="fas fa-book-open-reader"></i> المقطع</h2>
            <div class="wp-passage" id="wp-passage" dir="rtl"></div>
            <div class="wp-actions">
                <span class="mz-status" id="wp-count">لم تُعلّم أي وقف بعد</span>
                <span class="mz-status" id="wp-rec-note"></span>
                <span class="wp-actions-spacer"></span>
                <button class="mz-toggle-btn" id="wp-rec" type="button">
                    <span class="mz-dot"></span>
                    <i class="fas fa-microphone" id="wp-rec-icon"></i>
                    <span id="wp-rec-label">سجّل وقوفي</span>
                </button>
                <button class="mz-toggle-btn" id="wp-clear" type="button"><i class="fas fa-eraser"></i> مسح</button>
                <button class="mz-btn-primary" id="wp-grade" type="button"><i class="fas fa-clipboard-check"></i> قيّم وقوفي</button>
            </div>
        </section>

        <section class="mz-sec" id="wp-tajweed-sec" hidden>
            <h2 class="mz-sec-title"><i class="fas fa-magnifying-glass"></i> كشف أخطاء التجويد والنطق</h2>
            <div id="wp-tajweed-body"></div>
        </section>

        <section class="mz-sec" id="wp-result-sec" hidden>
            <h2 class="mz-sec-title"><i class="fas fa-clipboard-check"></i> نتيجة التقييم</h2>
            <div class="wp-scorewrap">
                <div class="wp-score" id="wp-score"><span id="wp-score-num">0</span><small>٪</small></div>
                <div class="wp-score-meta">
                    <div class="wp-score-title" id="wp-score-title"></div>
                    <div class="wp-tallies">
                        <span class="wp-tally wp-tally-good"><b id="wp-t-good">0</b> وقف صحيح</span>
                        <span class="wp-tally wp-tally-note"><b id="wp-t-note">0</b> تنبيه</span>
                        <span class="wp-tally wp-tally-err"><b id="wp-t-err">0</b> خطأ</span>
                    </div>
                </div>
            </div>
            <div class="wp-legend" id="wp-legend"></div>
            <div class="wp-passage wp-passage-graded" id="wp-graded" dir="rtl"></div>
            <div id="wp-followups"></div>
        </section>
    </main>

    <script src="{{ static_hash('js/mushaf_zipformer.js') }}"></script>
    <script src="{{ static_hash('js/mushaf-layout-core.js') }}"></script>
    <script src="{{ static_hash('js/waqf_practice.js') }}"></script>
</body>
</html>
