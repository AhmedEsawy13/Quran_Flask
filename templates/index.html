<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تطبيق القرآن الكريم - استمع وتعلم القرآن الكريم مع التفسير والترجمة">
    <meta name="theme-color" content="#4f46e5">
    <title>القرآن الكريم - Quranic App</title>
    <!-- Preload fonts for faster loading -->
    <link rel="preload" href="{{ url_for('static', filename='uthmanic_hafs_v20.ttf') }}" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="{{ url_for('static', filename='digitalkhatt.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css">
</head>
<body>
    <!-- Loading indicator -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner">
            <i class="fas fa-quran fa-spin"></i>
            <span>جاري التحميل...</span>
        </div>
    </div>
    
    <!-- Theme toggle buttons with better visibility -->
    <div class="theme-toggles">
        <div id="dark-mode-toggle-label" class="theme-toggle-btn" title="الوضع الليلي">
            <label for="dark-mode-toggle">
                <i class="fas fa-moon"></i>
            </label>
            <input type="checkbox" id="dark-mode-toggle">
        </div>
        <div id="sepia-mode-toggle-label" class="theme-toggle-btn" title="وضع القراءة">
            <label for="sepia-mode-toggle">
                <i class="fas fa-leaf"></i>
            </label>
            <input type="checkbox" id="sepia-mode-toggle">
        </div>
    </div>
    <div class="controls-container">
        <div id="controls">
            <select id="reciter-select">
                <option value="AbdulBaset AbdulSamad">عبد الباسط عبد الصمد</option>
                <option value="Mohamed al-Tablawi">محمد الطبلاوي</option>
                <option value="Mohamed al-Minshawi"> محمد صديق المنشاوي</option>
                <!-- Add more reciters here -->
            </select>
            <select id="surah-select"></select>
            <select id="ayah-select"></select>
            <button id="start-voice-command">امر صوتي</button>
            <button id="show-range-selection">تحديد نطاق</button>
            <select id="quran-text-select">
                <option value="qpc_hafs">UthmanicHafs</option>
                <option value="digital_khatt">Digital Khatt</option>
                <option value="indopak_nastaleeq">IndoPak Nastaleeq</option>
            </select>
            <select id="tafseer-select">
                <option value="تفسير القرطبي">تفسير القرطبي</option>
                <option value="تفسير السعدي">تفسير السعدي</option>
                <option value="تفسير البغوي">تفسير البغوي</option>
            </select>
        </div>
        <div class="ayah-container">
            <div id="quran-text"></div>
            <div id="transliteration-container" style="display: none;">
                <h2></h2>
                <div id="transliteration"></div>
            </div>
            <div id="tafseer-container" style="display: none;">
                <h2></h2>
                <div id="tafseer-text"></div>
            </div>
            <div class="operation-container">
                <div class="main-controls">
                    <audio id="quran-audio" controls></audio>
                    <button id="show-transliteration"> عرض النطق الحرفي</button>
                    <button id="play-pause-button">ايقاف / تشغيل</button>
                   <!-- <button id="download-button">تحميل</button>-->
                    <button id="show-tafseer">عرض التفسير </button>
                    <button id="toggle-word-meaning-button">عرض غريب الكلمات</button>
                    <div id="word-meaning-text" style="display: none;"></div>
                    <div class="repeat-control">
                        <label for="repeat-select">تكرار الاية:</label>
                        <select id="repeat-select">
                            <option value="1">مرة واحدة</option>
                            <option value="2">مرتين</option>
                            <option value="3">3 مرات</option>
                            <option value="loop">تكرار مستمر</option>
                        </select>
                    </div>
                </div>
                <div class="navigation-controls">
                    <button id="prev-ayah">الاية السابقة</button>
                    <button id="next-ayah">الاية التالية</button>
                </div>
            </div>
        </div>
    </div>
    <div id="rangeModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <label for="start-ayah-select">بداية النطاق </label>
            <select id="start-ayah-select"></select>
            <label for="end-ayah-select">نهاية النطاق</label>
            <select id="end-ayah-select"></select>
            <button id="play-range">تشغيل</button>
        </div>
    </div>
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
