name: Core regression and data integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Restore pinned reciter timestamps
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/import_qul_reciters.py --restore

      - name: Audit release databases and canonical streams
        run: python3 pipeline/audit_release_readiness.py

      - name: Run deterministic classical-book audits
        run: |
          python3 pipeline/audit_classical_catalog.py
          python3 pipeline/audit_manar_completeness.py --strict
          python3 pipeline/audit_muktafa_accuracy.py --strict
          python3 pipeline/audit_traceability.py \
            --db data/classical_waqf.db --source manar --samples 0 \
            --max-suspect 102

      - name: Smoke-test the complete local application
        run: python3 scripts/smoke_test.py --local --include-editor

      - name: Run full regression suite
        run: python3 -m pytest -q
