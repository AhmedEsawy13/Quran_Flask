name: Next.js frontend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        env:
          ATHAR_API_ORIGIN: http://127.0.0.1:5001
          NEXT_PUBLIC_LEGACY_APP_ORIGIN: http://127.0.0.1:5001
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: npm run build

      - name: Install Flask runtime and Chromium
        run: |
          pip install -r requirements.txt
          cd frontend
          npx playwright install --with-deps chromium

      - name: Restore pinned reciter timestamps
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/import_qul_reciters.py --restore

      - name: Run frontend desktop and mobile journeys
        working-directory: frontend
        run: npm run test:smoke

      - name: Upload frontend browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
