<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مراجعة علامات الوقف — المساحة</title>
<style>
:root{--bg:#faf8f3;--card:#fff;--ink:#1d1b16;--mut:#6b655a;--line:#e3ddd0;--ok:#1f7a4d;--bad:#b3261e;--warn:#9a6700;--acc:#2b5d8a;--okbg:rgba(31,122,77,.1);--warnbg:rgba(154,103,0,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#16140f;--card:#201d17;--ink:#ece6d8;--mut:#a39b8a;--line:#383327;--ok:#5fc08c;--bad:#f2766d;--warn:#e0b04a;--acc:#7fb0e0;--okbg:rgba(95,192,140,.14);--warnbg:rgba(224,176,74,.16)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Geeza Pro","Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
header h1{font-size:16px;margin:0}
#save{font-size:13px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
#save.ok{color:var(--ok);border-color:var(--ok)}#save.err{color:#fff;background:var(--bad);border-color:var(--bad);font-weight:600}
button,select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
#wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:14px;padding:12px 14px 60px;max-width:1500px;margin:0 auto}
#pane{position:sticky;top:60px;align-self:start}
.fig{position:relative;display:inline-block;line-height:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.fig img{height:auto;width:auto;max-width:100%;max-height:calc(100vh - 80px)}
.wb{position:absolute;cursor:pointer}.wb:hover{background:rgba(43,93,138,.16);outline:1px solid var(--acc)}
.mk{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:3px solid;background:transparent;pointer-events:auto;cursor:pointer}
.mk span{position:absolute;left:50%;top:-17px;transform:translateX(-50%);min-width:20px;height:18px;padding:0 4px;border-radius:9px;background:#fff;border:2px solid;font:700 12px/14px system-ui;text-align:center;line-height:14px}
.mk.s-accept{border-color:var(--ok);color:var(--ok)}.mk.s-review{border-color:var(--warn);color:var(--warn)}.mk.s-reject{border-color:#999;color:#999;opacity:.5}.mk.s-reject span{text-decoration:line-through}.mk.cur{box-shadow:0 0 0 3px var(--acc)}
.pgh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 8px}.pgh h2{margin:0;font-size:17px}
.sec{font-size:13px;color:var(--mut);margin:12px 0 4px;display:flex;justify-content:space-between}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:6px 0;padding:6px 10px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.item.cur{outline:2px solid var(--acc)}.item.s-accept{border-inline-start:5px solid var(--ok)}.item.s-review{border-inline-start:5px solid var(--warn);background:var(--warnbg)}.item.s-reject{border-inline-start:5px solid #999;opacity:.6}
.w{font-size:22px;font-family:"Amiri Quran","Geeza Pro",serif;min-width:80px}
.syms{display:flex;gap:4px;flex-wrap:wrap}.syms button{min-width:36px;padding:3px 8px}.syms button.on{background:var(--ok);color:#fff;border-color:var(--ok)}.syms button.model{border-color:var(--acc)}
.syms .no.on{background:#777;border-color:#777}
.meta{grid-column:1/-1;font-size:12px;color:var(--mut)}
.tag{display:inline-block;padding:0 7px;border:1px solid var(--line);border-radius:99px;margin-inline-end:5px}
details>summary{cursor:pointer;color:var(--mut);font-size:13px;margin:10px 0 4px}
#add{position:fixed;z-index:30;background:var(--card);border:1px solid var(--acc);border-radius:10px;padding:8px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#add[hidden]{display:none}#add .syms button{min-width:40px}
.hint{color:var(--mut);font-size:13px;margin:0 0 8px}
@media(max-width:900px){#wrap{grid-template-columns:1fr}#pane{position:static}}
</style></head><body>
<header><h1>مراجعة علامات الوقف</h1><span id="save">…</span>
<button id="prev">→</button><select id="sel"></select><button id="next">←</button>
<span id="prog" style="font-size:13px;color:var(--mut)"></span></header>
<div id="wrap"><div id="list"></div><div id="pane"><div class="fig" id="fig"><img id="img" alt=""></div></div></div>
<div id="add" hidden><div id="addw" class="w"></div><div class="syms" id="addsyms"></div></div>
<script>
let P=[],V={},D=new Set(),SYM=[],cur=0,sel=null;const $=id=>document.getElementById(id);
const toAr=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const status=(k,m)=>{$('save').className=k;$('save').textContent=m};
async function api(path,body){try{const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw 0;const j=await r.json();status('ok','محفوظ على الخادم ✓');return j}catch(e){status('err','لم يُحفظ! الخادم لا يستجيب — لا تُكمل');return null}}
const pg=()=>P[cur];
const key=(page,k)=>page+':'+k;
function state(pr){const v=V[key(pg().page,pr.key)];if(v==='-')return 'reject';if(v)return 'accept';return pr.default==='accept'?'accept':'review'}
function finalSym(pr){const v=V[key(pg().page,pr.key)];if(v==='-')return null;if(v)return v;return pr.default==='accept'?pr.symbol:null}
function counts(p){let rev=0,acc=0,rej=0;for(const pr of p.proposals){const v=V[key(p.page,pr.key)];if(v==='-')rej++;else if(v)acc++;else if(pr.default==='accept')acc++;else rev++}
  const added=Object.keys(V).filter(k=>k.startsWith(p.page+':')&&V[k]!=='-'&&!p.proposals.some(q=>key(p.page,q.key)===k)).length;return{rev,acc,rej,added}}
function fillSel(){const s=$('sel');s.innerHTML='';P.forEach((p,i)=>{const c=counts(p);const o=document.createElement('option');o.value=i;o.textContent=`${D.has(p.page)?'✓ ':''}صفحة ${p.page} · للمراجعة ${c.rev}`;s.appendChild(o)});s.value=cur;$('prog').textContent=`${toAr(D.size)}/${toAr(P.length)} صفحة منتهية`}
async function setV(pr,sym){const p=pg();const r=await api('/api/verdict',{page:p.page,key:pr.key,symbol:sym});if(!r)return;if(sym===null)delete V[key(p.page,pr.key)];else V[key(p.page,pr.key)]=sym;render(true)}
async function addMark(w,sym){const p=pg();const r=await api('/api/verdict',{page:p.page,key:w.key,symbol:sym});if(!r)return;if(sym===null)delete V[key(p.page,w.key)];else V[key(p.page,w.key)]=sym;$('add').hidden=true;render(true)}
function item(pr){const s=state(pr),f=finalSym(pr);const d=document.createElement('div');d.className='item s-'+s+(sel===pr.key?' cur':'');d.dataset.k=pr.key;
  const mods=Object.entries(pr.models||{}).map(([m,[sy,cf]])=>`${m}:${sy} ${Math.round(cf*100)}`).join(' · ');
  d.innerHTML=`<div class="w">${esc(pr.text)}</div><div class="syms">${SYM.map(x=>`<button data-s="${x}" class="${f===x?'on':''} ${x===pr.symbol&&f!==x?'model':''}">${x}</button>`).join('')}<button class="no ${s==='reject'||(f===null&&s!=='review')?'on':''}" data-s="-">ليست علامة</button></div>
  <div class="meta"><span class="tag">${pr.why}</span><span class="tag">اقتراح ${pr.symbol} ${Math.round(pr.conf*100)}٪</span>${pr.column?`<span class="tag">المصحف المرجعي: ${pr.column}</span>`:'<span class="tag">لا علامة في المرجع</span>'}${pr.prior?'':'<span class="tag">خارج المقبول سابقًا</span>'} <span title="${esc(mods)}">سطر ${toAr(pr.line)}</span></div>`;
  d.onclick=e=>{const b=e.target.closest('button[data-s]');sel=pr.key;if(b){const v=b.dataset.s;const same=(v==='-'?V[key(pg().page,pr.key)]==='-':finalSym(pr)===v&&V[key(pg().page,pr.key)]===v);setV(pr,same?null:v)}else render(true)};return d}
function render(keep){const p=pg();const y=scrollY;const L=$('list');L.innerHTML='';
  const c=counts(p);const h=document.createElement('div');h.className='pgh';h.innerHTML=`<h2>صفحة ${p.page}</h2><span class="tag">للمراجعة ${toAr(c.rev)}</span><span class="tag">علامات ${toAr(c.acc+c.added)}</span><button id="doneb">${D.has(p.page)?'إلغاء الإنهاء':'أنهيت الصفحة ✓'}</button>`;L.appendChild(h);
  const hint=document.createElement('p');hint.className='hint';hint.textContent='الأخضر مقبول تلقائيًا (اتفقت النماذج وسبق أن اتفق معها المصحف المرجعي)، الأصفر يحتاج قرارك: اختر الرمز الصحيح أو «ليست علامة». علامة فاتت النماذج؟ انقر على الكلمة في الصورة. مفاتيح: ↑↓ تنقّل · ١–٧ الرمز · X ليست علامة · Enter قبول الاقتراح · D إنهاء الصفحة.';L.appendChild(hint);
  const rev=p.proposals.filter(x=>state(x)==='review'),dec=p.proposals.filter(x=>state(x)!=='review'&&!(x.default==='accept'&&V[key(p.page,x.key)]===undefined));
  const auto=p.proposals.filter(x=>x.default==='accept'&&V[key(p.page,x.key)]===undefined);
  const sec=(t)=>{const e=document.createElement('div');e.className='sec';e.innerHTML=`<span>${t}</span>`;L.appendChild(e)};
  sec(`تحتاج مراجعتك (${toAr(rev.length)})`);rev.forEach(x=>L.appendChild(item(x)));if(!rev.length){const e=document.createElement('p');e.className='hint';e.textContent='لا شيء معلّق في هذه الصفحة.';L.appendChild(e)}
  if(dec.length){sec(`قرارات اتخذتها (${toAr(dec.length)})`);dec.forEach(x=>L.appendChild(item(x)))}
  const det=document.createElement('details');det.innerHTML=`<summary>مقبولة تلقائيًا (${toAr(auto.length)})</summary>`;auto.forEach(x=>det.appendChild(item(x)));L.appendChild(det);
  const added=Object.keys(V).filter(k=>k.startsWith(p.page+':')&&V[k]!=='-'&&!p.proposals.some(q=>key(p.page,q.key)===k));
  if(added.length){sec(`علامات أضفتَها (${toAr(added.length)})`);for(const k of added){const w=p.words.find(w=>key(p.page,w.key)===k);if(!w)continue;const d=document.createElement('div');d.className='item s-accept';d.innerHTML=`<div class="w">${esc(w.text)}</div><div class="syms"><button class="on">${V[k]}</button><button data-rm="1">حذف</button></div>`;d.querySelector('[data-rm]').onclick=()=>addMark(w,null);L.appendChild(d)}}
  $('doneb').onclick=async()=>{const r=await api('/api/done',{page:p.page,done:!D.has(p.page)});if(!r)return;D=new Set(r.done);fillSel();render(true)};
  // image overlay
  const fig=$('fig');fig.querySelectorAll('.wb,.mk').forEach(e=>e.remove());const pc=n=>(100*n).toFixed(3)+'%';
  for(const w of p.words){const b=document.createElement('div');b.className='wb';b.style.cssText=`left:${pc(w.box[0]/p.w)};top:${pc(w.box[1]/p.h)};width:${pc((w.box[2]-w.box[0])/p.w)};height:${pc((w.box[3]-w.box[1])/p.h)}`;b.title=w.text;b.onclick=e=>openAdd(w,e);fig.appendChild(b)}
  for(const pr of p.proposals){const f=finalSym(pr),s=state(pr);const m=document.createElement('div');m.className='mk s-'+s+(sel===pr.key?' cur':'');m.innerHTML='<span>'+esc(f||pr.symbol)+'</span>';m.style.left=pc(pr.seat[0]/p.w);m.style.top=pc(pr.seat[1]/p.h);m.onclick=e=>{e.stopPropagation();sel=pr.key;render(true);document.querySelector('.item.cur')?.scrollIntoView({block:'center'})};fig.appendChild(m)}
  const img=$('img');if(!img.src.endsWith(`/img/p${p.page}.jpg`))img.src=`/img/p${p.page}.jpg`;
  if(keep)scrollTo(0,y);fillSel()}
function openAdd(w,e){const a=$('add');$('addw').textContent=w.text;const S=$('addsyms');S.innerHTML=SYM.map(x=>`<button data-s="${x}">${x}</button>`).join('')+'<button data-s="-">لا علامة</button>';
  const cur=V[key(pg().page,w.key)];S.querySelectorAll('button').forEach(b=>{if(b.dataset.s===cur)b.classList.add('on');b.onclick=()=>{const prop=pg().proposals.find(q=>q.key===w.key);if(prop)setV(prop,b.dataset.s==='-'?'-':b.dataset.s).then(()=>a.hidden=true);else addMark(w,b.dataset.s==='-'?null:b.dataset.s)}});
  a.hidden=false;a.style.left=Math.min(innerWidth-260,e.clientX)+'px';a.style.top=Math.min(innerHeight-120,e.clientY+10)+'px'}
document.addEventListener('click',e=>{if(!e.target.closest('#add')&&!e.target.closest('.wb'))$('add').hidden=true});
function go(i){if(i<0||i>=P.length)return;cur=i;sel=null;try{localStorage.setItem('msl_cur',i)}catch(e){}render();scrollTo(0,0)}
function items(){return [...document.querySelectorAll('.item[data-k]')]}
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const p=pg();if(!p)return;const list=items();let idx=list.findIndex(x=>x.dataset.k===sel);
  const pick=pr=>{sel=pr.key;render(true);document.querySelector('.item.cur')?.scrollIntoView({block:'center',behavior:'smooth'})};
  const byKey=k=>p.proposals.find(q=>q.key===k);
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=Math.max(0,Math.min(list.length-1,(idx<0?0:idx+(e.key==='ArrowDown'?1:-1))));const pr=byKey(list[n]?.dataset.k);if(pr)pick(pr)}
  else if(/^[1-7]$/.test(e.key)){const pr=byKey(sel);if(pr){setV(pr,SYM[+e.key-1])}}
  else if(e.key==='x'||e.key==='X'||e.key==='س'){const pr=byKey(sel);if(pr)setV(pr,'-')}
  else if(e.key==='Enter'){const pr=byKey(sel);if(pr){setV(pr,pr.symbol).then(()=>{const l=items();const i=l.findIndex(x=>x.dataset.k===sel);const nx=byKey(l[i+1]?.dataset.k);if(nx)pick(nx)})}}
  else if(e.key==='Backspace'){const pr=byKey(sel);if(pr){setV(pr,null)}e.preventDefault()}
  else if(e.key==='d'||e.key==='D'){$('doneb')?.click()}
  else if(e.key==='ArrowLeft')go(cur+1);else if(e.key==='ArrowRight')go(cur-1)});
$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);$('sel').onchange=e=>go(+e.target.value);
(async()=>{try{P=await (await fetch('/pages.json')).json();const s=await (await fetch('/api/state')).json();V=s.verdicts;D=new Set(s.done);SYM=s.symbols;status('ok','محفوظ على الخادم ✓')}catch(e){status('err','تعذّر الاتصال بالخادم');return}
  try{cur=Math.min(P.length-1,+(localStorage.getItem('msl_cur')||0))}catch(e){}render()})();
</script></body></html>
